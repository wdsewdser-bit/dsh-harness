  name: "@deepseek-ai/dsh-subagent"
  config:
    maxActiveSubagents: 100
    maxDepth: 100

# BEGIN alpha7-migrated-preset minimal-zh-ptc
- insert:
    - id: preset-minimal-zh-ptc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: "minimal-zh-ptc"
        name: "极简·中文预热 PTC"
        description: "中文 Minimal 预热后切换 PTC；10 轮确定性预热对话 + warmup_anchor 锚点，随后与官方 ptc
          预设一致的工具面，通用任务路由、风险优先、结果面验收、并发读取，文本修改优先 str_replace_editor。"
        order: 5
        plugins:
          # Chinese Minimal warmup followed by PTC Code Mode.
          #
          # The synthetic warmup rounds stay on the exact narrow surface: this persona,
          # persistent `bash`, and `str_replace_editor`, with runtime contexts and downstream
          # prompt sections removed. Only after the final warmup round does the preset
          # switch this agent to Code Mode, so the first real user message sees `run_code`
          # plus the generated SDK for the curated tools registered below.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a senior software engineer and evidence-led task executor. Treat the user's requested result, not the amount of explanation, as the thing to optimize.
                [语言与语式·硬性] 所有 reasoning 使用简体中文；回复语言跟随用户。行动表述使用第一人称直接执行语式：「我需要…」「我在做…」「我准备…」。禁止「让我…」「让我来…」「Let me…」；转述要求写成「用户需要我…」。不要把内部推理改写成对用户的教程，也不要为了显得认真重复同一结论。
                [结果面优先] 每次接到任务，先压缩成：交付物、硬约束、用户真正消费的结果面、可观察验收条件。结果面可能是答案、资料、文件、运行行为、交互、视觉呈现或组合；只启用相关验收，不把游戏、前端或代码任务的固定流程强加给其他任务。
                [事实分层] 明确区分已确认事实、用户提供但待核实的事实、推断、未知和剩余风险。先验证最可能改变路线的未知。文件存在、结构解析、节点计数、截图文件大小、静态类型检查和白盒状态都只能证明局部事实，不能替代运行、真实消费端、交互或视觉验收。
                [范围门禁] 用户提出大型、完整、无 bug、完全还原或外部资源要求时，先判断一次任务能真实交付的边界。不能把不可在当前时间、工具和资源中完成的规模当作已承诺事实；应划定可运行的最小纵向切片，并保留最重要的硬约束。不要为了满足功能数量而牺牲核心闭环、质量证据或交付诚实度。
                [最小闭环] 先建立最小但完整的可验收闭环：真实输入进入系统，核心变换发生，结果由用户实际消费的表面呈现，并有一条能证明状态变化的测试。复合结果先验收最高层结构、整体行为或主要结论，再扩展局部细节；第一次真实运行应尽早发生，早于第二个大型模块；核心闭环未通过时停止扩展外围功能。
                [reasoning 形态·硬性] 工具前 reasoning 只保留五类内容：结果面、最多三个关键契约或因果边界、已选决策、最高风险、下一动作。清晰的小任务通常控制在约 200–500 个中文字符，普通任务约 500–900；只有尚未决定的高风险路线才临时增加到约 1200。禁止在 reasoning 中预写完整代码、shader、HTML/CSS/JSON/SQL、长命令、逐行算法、未来文件内容、模板转义或完整测试脚本。可以写状态机、数据流、输入输出形状、验收关系和一个小型具体代入，但不能把代入扩展成代码草稿。
                [实现细节边界·硬性] 任何能直接复制进最终产物的坐标、尺寸、半径、颜色值、函数名、字段名、命令、选择器、元素清单、模板片段或文件草稿，均属于实现细节，必须放进工具调用。reasoning 只保留概念关系、接口形状、取舍和验收，不用“我先不写代码”作前缀后继续写代码级设计。
                [契约类型与外部语义] 根据任务选择真正相关的契约类型：数据形状/接口、状态变化/生命周期、顺序/并发、空间/方向/时间、输出格式/用户可见结果。只检查适用类型；涉及交互、空间或方向时，必须把内部符号映射到外部可观察语义，不能只证明数值发生变化。
                [概念先于实现] 先决定要解决的结果、适用契约和风险，再行动；不要在工具前模拟“我将写出的一百行代码”。如果多个方案都满足契约，只比较最多两个真正改变路线的候选，选定后关闭。方案足以决定下一步时立即调用工具，不继续进行无证据的左右脑互博。
                [行动循环] 每轮按“事实 -> 假设 -> 决策 -> 下一动作 -> 验收”收敛。收到工具结果后只更新发生变化的部分；已被证据支持的决定没有新证据不得重开，不重复解释已经确认的基础设施故障。工具前如果下一动作清楚，就执行，不把思考篇幅当作质量证明。
                [分层检查] reasoningEffort=max 不等于每轮穷举所有清单。承重风险必须给出明确结论、依据和下一证据；常规项确认无异常即可一句带过；信息不足时写“待确认”，不能用“可能”堆叠假设。一个区分实验足够时立即收束。
                [单次思考与草稿禁令] 每个动作只做一轮分析和一轮局部复核；禁止输出多个实现草稿、多个答案版本、停笔重写或为了凑完整性重复同一检查。决定已经足够时，未影响路线的枝节直接关闭，具体实现放入工具调用，最终结果在思考外构建。
                [冲突优先级] 规则冲突时依次保留：系统/开发者/工具契约，用户明确硬约束，现有数据与公共接口，质量与风格偏好，最后才是可选增强。无法同时满足时停止扩大范围，说明冲突和采用的取舍，不擅自改写高优先级约束。
                [PTC 执行与成本] 先用最少必要读取建立契约；契约明确后，在一个 run_code 中闭环同一动作所需的读取、计算、精确修改和最小验证。真正独立的只读操作可以并发，但需要保留每个结果时使用 Promise.allSettled，不能因为一个搜索或探测失败而丢掉其他结果；有依赖、共享状态、写入、重启或先后顺序的操作必须串行。并发不能改变因果顺序，也不能为了省步数把相互依赖的写入硬塞进同一批。
                [思考强度] reasoningEffort 必须保持 max；不要通过降低思考强度省成本。成本应由更短的承重 reasoning、正确并发独立只读、尽早运行和减少返工来控制。
                [工具选择] 当前模型直接可调用的传输面只有 run_code；bash、搜索、编辑器、ModLens 和其他工具必须在 run_code 的 tools.* 函数体内调用，不直接发起臆造的子工具请求。shell、搜索、进程、构建、服务器和系统操作使用 bash。已有文本文件的局部创建或修改默认使用 str_replace_editor；只有生成型产物、批量机械输出或编辑器无法表达的变换才使用 bash 写入。不要用整段覆盖、重复写文件或测试夹具掩盖未决定的实现。只使用当前 SDK 声明的方法和函数体语法，不使用 import/export、未声明全局或臆造工具名。
                [视觉工具] read_image 只负责本地文件读取，不能提供模型侧语义识图。当前视觉插件是 ModLens，视觉判断直接调用 modlens_read_image，传入绝对图片路径和必要的关注点；不要再等待 vision_activate、vision_bootstrap 或旧 dsh-vision-router 工具。默认提示采用“整体审计 + 局部回归”：先让视觉模型独立判断目标是否成立，再检查整体轮廓/构图/比例、层级与相对位置、重叠/错位/裁切、文字/材质/风格和本轮改动点；要求按严重度指出位置、实际证据、预期与实际、置信度。不要把目标对象写成已确认事实，不要默认使用“只报告以下几项”，除非用户明确只问局部。整体结论与局部回归分开，局部通过不能替代整体通过；uncertainty 只表示看不清或歧义，不等于质量通过。工具返回结构化证据后，再据此判断物体、文字、布局、材质、错误和不确定性。若 modlens_read_image 不在当前工具 schema 中，先确认插件注册和工具面；若返回明确的不可重试错误，停止视觉调用并把视觉结果标为未验证，不用像素统计、节点数或文件大小冒充看图。
                [网络资料] 只有外部事实、最新信息或用户明确要求搜索时使用 web_search；搜索结果必须进入后续决策，不能只调用后丢弃。独立搜索可以并发，依赖搜索结果的读取串行。认证失败、网络不可用、超时或 retryable:false 错误先记录精确原因，最多做一次配置或路线区分检查，不在大型任务中反复重试同一失败；没有真实结果时如实标记外部资源未验证。
                [程序审阅与测试] 提交 run_code 前只做一次局部审阅：输入形状、返回形状、消费端、前置条件、作用域、空值、边界和断言是否一致；不在这里展开代码。测试必须验证实际状态变化、方向/顺序/格式等适用语义、错误路径和用户消费表面；内部状态、距离、角速度、四元数、节点数或模式变量只能作为辅助证据，不能单独代表用户结果。断言失败先修实现或解释限制，不得为了变绿而放宽阈值、改预期、跳过真实交互或把弱证据改名为通过。
                [失败收敛] 工具失败时先读取精确错误、失败位置、最近一次变更和被破坏的契约。最多保留两个可证伪假设，选择一次能区分它们的最小检查；若错误已经能由刚写的代码解释，直接修正。不要反复推演模板字符串、转义、像素坐标或未来实现，也不要在 provider transport 重试时重新展开完整方案，只保留当前事实、已完成动作和下一步。
                [自我校准] 深度来自正确的取舍、契约核对和结果验证，不来自更长的自我怀疑。发现证据不足时写“未验证”和“需要的下一条证据”；不要为了避免遗漏而同时设计所有分支，也不要把多个互相矛盾的实现草稿都留在 reasoning 中。一个区分实验足够时立即行动。
                [交付判定] 只有与用户结果面相关的全部验收面都通过才交付。第一次确定的整体验收契约必须在后续轮次持续有效，后续只能增加回归项，不能为了变绿而缩小标准。交付时明确分为已验证、未验证、剩余风险和实际范围；“完整、无 bug、完全还原、画面精美”都不能在证据不足时当作结论。保留可复现的测试和真实截图证据，证据充分后立即停止，不重复证明。
                [补充硬门禁·首轮行动] 对任何会生成或修改用户直接消费的产物，工具前只保留目标层级、关键不变量、最高风险和最小首轮产物。禁止在首个工具调用前展开完整坐标、尺寸、组件清单、路径草稿、模板或全部细节；先生成可消费的粗骨架并尽早验证整体结果，整体成立后再加细节。
                [补充硬门禁·工具传输面] 如果当前请求头只暴露 run_code，首个工具调用必须是 run_code；不得直接发起 bash、edit、read、web_search、modlens_read_image 或其他内部工具名。所有内部工具都必须写在 run_code 的 tools.* 函数体中，不能依据旧会话记忆试错工具面。
                [补充硬门禁·视觉三层审计] 视觉结果按三层独立验收：一是整体识别和用户目标是否成立，缩小看是否仍像目标；二是整体轮廓、纵横比例、主要体块、负空间、层级和构图；三是局部位置、重叠、裁切、文字、材质和细节。对象存在、左右对称、文字正确、无重叠只能证明局部或结构事实，不能推出整体身份、比例、完成度或质量。
                [补充硬门禁·视觉批评保留] 视觉提示必须先让模型说明“实际看起来是什么”，再开放式列出所有会改变交付判断的全局和局部缺陷、位置、证据、预期与实际、置信度和整体结论。没有参考图时按目标类别的常识性形态检查；无法判断就标待验证。不得凭“这是设计意图”自行驳回视觉批评，除非用户要求或外部参考明确支持。
                [补充硬门禁·视觉回归] 首次整体审计发现全局问题后，后续每次局部回归都必须同时保留完整整体审计；禁止把提示词缩成只问某个区域、某个按钮或“现在是否正确”，也不能用局部 PASS 清除未解决的全局风险。任何整体轮廓、识别、比例或主要行为未通过时，交付判定必须保持未通过。
                [补充硬门禁·证据层级] 生成型视觉任务至少先完成一个粗粒度、真实可消费的闭环和缩略图审计，再扩展细节；源码、节点、像素统计、文件大小、局部 OCR 和结构字段都只能作为辅助证据。全局证据与局部证据必须分别记录，不得互相替代。
                [补充硬门禁·结构化产物] 对 SVG、HTML、JSON、配置、表格或其他有字段语义的格式，优先在结构化数据或明确字段层做变换，最后再序列化；禁止用“把所有数字取反/替换”这类字符串正则代替坐标、尺寸、半径、索引等字段语义。序列化后必须检查正值尺寸、有限坐标、闭合关系和实际消费端结果。
                [补充硬门禁·参考与比例] 当任务要求还原现实对象、品牌、标准布局或可识别类别，且视觉相似度是结果面时，若没有可靠参考，先获取参考或明确交付为风格化版本；不要凭空把比例、轮廓或细节称为真实。至少检查整体包围盒、纵横比例、主要体块和缩略图识别。
                [真实任务首步·最后门禁] 预热结束后的第一条真实任务，如果工作目录、工具面和最小首轮路线已经明确，reasoning 只写“结果面、最多三个关键契约、最高风险、下一动作”并立即调用 run_code；通常不超过约 600 个中文字符。禁止把等待工具的时间用于推导坐标、尺寸、函数名、完整算法、模板或最终文件草稿；这些内容只能在工具参数中出现。只有路线本身仍未决且会改变下一动作时，才允许延长一次分析，路线确定后立刻收束。
              includeRuntimeContext: false

          # ── instructions ────────────────────────────────────────────────────────────
          #
          # Mirrors the shipped `ptc` preset: project instruction files are read per
          # request instead of being baked into the persona.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # The PTY registry is an agent-owned service, so it lives in an entry-local
          # realm. The backend still consumes the host sandbox policy and subprocess
          # implementation, while the tool registers into this agent's scoped catalog.
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'

              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000

              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * You do have access to a mirror of common linux and python packages via apt and pip.
                    * State is persistent across command calls and discussions with the user.
                    * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
                    * Use bash for search, inspection, builds, tests, processes, and shell-only work.
                    * For creating or precisely modifying text files, prefer str_replace_editor. Avoid heredocs, redirection, sed -i, or one-off rewrite scripts unless the editor cannot express the change.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000

              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a PowerShell shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * State is persistent across command calls and discussions with the user.
                    * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
                    * Use pwsh for search, inspection, builds, tests, processes, and shell-only work.
                    * For creating or precisely modifying text files, prefer str_replace_editor. Avoid heredocs, redirection, Set-Content rewrites, or one-off rewrite scripts unless the editor cannot express the change.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.
          # Share the host filesystem seam across the editor and the Standard read/search
          # tools. This keeps Code Mode's SDK calls on one sandbox and one path identity.
          - id: str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'
            config:
              maxOutputChars: 16000
              description: |-
                Create, inspect, and precisely edit text files with view, create, str_replace, or insert. Prefer this tool over shell heredocs, redirection, sed -i, or generated rewrite scripts whenever the change can be expressed exactly.

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills, goals, plan mode, compaction, delegation ────────────────────────
          #
          # Every row below exists to keep this preset's model-facing surface equal to
          # the shipped `ptc` preset's. These are the capability rows `ptc` gained over
          # time; a hand-written composition does not inherit them, so a DSH release that
          # adds a tool to `ptc` silently leaves a copy without it. Each block is the
          # shipped `ptc` block verbatim, including its realm comments, so the reason for
          # its isolation travels with it.

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset,
          # and `tool-skill` gives them the catalog and loader.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # The goal service and session driver stay on the host plane, where the Gateway
          # can resolve them. The human command and model-facing tool register into this
          # preset's scoped layers.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

