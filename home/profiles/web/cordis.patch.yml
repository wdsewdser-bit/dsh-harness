# ── Agent Team v13: context-economy plugins ─────────────────────────────────
# action-fusion    : edit/write results carry their validation output in the
#                    same observation (SoL-Pi "Action Fusion", v2). Rules are
#                    language-aware; Rust uses a crate-scoped cargo check.
# observation-pack : large observations become a compact handle pointing at the
#                    spilled full text, recalled with the existing read tool
#                    (SoL-Pi "ObservationPack").
#
# Both listen on tools/post-execute; action-fusion is registered first so it is
# the OUTER listener and its validation block stays visible even when
# observation-pack packs the tool's own output.
#
# Revert: point the action-fusion row back at ./plugins/action-fusion.mjs and
# delete the v2 file.
- insert:
    - id: action-fusion
      name: './plugins/action-fusion-v2.mjs'
      config:
        rules:
          - match: '/[.](rs)$/'
            command: 'cargo check --message-format short -p {crate}'
            timeoutMs: 180000
          - match: '/[.](ts|tsx)$/'
            command: 'tsc --noEmit'
            timeoutMs: 120000
            shell: 'cmd'
            requireFile: 'tsconfig.json'
          - match: '/[.](py)$/'
            command: 'python -m py_compile "{file}"'
            timeoutMs: 30000
          - match: '/[.](go)$/'
            command: 'gofmt -l "{file}"'
            timeoutMs: 30000
          - match: '/[.](js|mjs|cjs)$/'
            command: 'node --check "{file}"'
            timeoutMs: 20000
        shell: 'none'
        keepOutputChars: 4000
        crateCooldownMs: 60000
        telemetryDir: 'D:\dsh-test\home\team-control-plane'
    - id: observation-pack
      name: './plugins/observation-pack-v2.mjs'
      config:
        maxInlineBytes: 10240
        fullSends: 2
        previewBytes: 1024
        evidenceChars: 1500
        spillDir: 'D:\dsh-test\home\spill'
        telemetryDir: 'D:\dsh-test\home\team-control-plane'
    - id: evidence-reducer
      name: './plugins/evidence-reducer.mjs'
      config:
        enabled: true
        settingsFile: 'D:\dsh-test\home\evidence-reducer.json'
        useSettingsFile: true
        archiveDir: 'D:\dsh-test\home\evidence-archive'
        sessionsRoot: 'D:\dsh-test\home\sessions'
        telemetryDir: 'D:\dsh-test\home\team-control-plane'
        localProviders:
          - opencodego
        tools: []
        routeMode: 'session'
        provider: ''
        model: ''
        reasoningEffort: ''
        remoteAllowed: false
        thresholdBytes: 32768
        maxReceiptTokens: 1200
        maxQuotes: 16
        timeoutMs: 45000
        maxInputBytes: 131072
        maxInputLines: 3000
        controlDir: 'D:\dsh-test\home\team-control-plane'
        controlPlaneEnabled: true
    - id: evidence-reducer-ui
      name: './plugins/evidence-reducer-ui/index.js'
    - id: cache-prefix
      name: './plugins/team-v13-cache-monitor.mjs'
      config:
        sessionsRoot: 'D:\dsh-test\home\sessions'
        telemetryDir: 'D:\dsh-test\home\team-control-plane'
        dropThreshold: 0.15
    - id: failure-memory
