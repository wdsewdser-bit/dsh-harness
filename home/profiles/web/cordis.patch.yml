        controlDir: 'D:\dsh-test\home\team-control-plane'

    - id: tool-agent-team-v2
      name: './plugins/team-tools-v2-r10.mjs'
      config:
        freshProvider: spawn
        forkProvider: fork
        scopesFile: 'D:\dsh-test\home\write-scopes.json'
        rolesDir: 'D:\dsh-test\home\team-roles'
        reportDir: 'D:\dsh-test\home\team-reports'
        clearanceFile: 'D:\dsh-test\home\team-clearances.json'
        milestonePath: 'D:\dsh-test\home\team-milestones.json'
        healthPath: 'D:\dsh-test\home\team-health-web.json'
        windowTokens: 1000000
        maxRoomRounds: 3
        controlDir: 'D:\dsh-test\home\team-control-plane'
        reservedOutputTokens: 32768
        safetyMarginTokens: 8192
        activityDigestIntervalMs: 600000
        enablePreStep: true

    # v12 bridge: keeps the proven r10 workflow, but mirrors durable effects
    # into task contracts, Room cursors, wake inbox, evidence, compaction jobs,
    # merge operations and a causal timeline. One aggregate tool keeps the
    # model-facing schema small.
    - id: team-v12-runtime
      name: './plugins/team-v12-runtime.mjs'
      config:
        # Window admission by the wiring plugin. Only a session it admits is affected.
        windowAdmission: runtime
        windowHostParticipation: true
        windowOsFileProtection: true
        profile: web-test
        rolesDir: 'D:\dsh-test\home\team-roles'
        pluginDir: 'D:\dsh-test\home\profiles\web\plugins'
        controlDir: 'D:\dsh-test\home\team-control-plane'
        windowTokens: 1048576
        contextPackMaxTokens: 80000
        # The root's pack and the mid-turn delta used to default to 6000 and 2500 tokens. The identity alone is a
        # few thousand, so a changed task contract on top of it did not fit and the turn ended as blocked.
        tier0ContextPackMaxTokens: 16000
        contextDeltaMaxTokens: 6000
        reservedOutputTokens: 32768
        costAlertThreshold: 25000
        hypothesis:
          enabled: true
        activeIdentity:
          enabled: true
          hostBootstrap: true
          allowedRoots:
            - 'D:\dsh-test\home\team-roles'

    - id: team-v14-event-continuation
      name: './plugins/team-v14-event-continuation.mjs'
      config:
        controlDir: 'D:\dsh-test\home\team-control-plane'
        scanMs: 30000
        maxPerScan: 4

    # Keep the shipped Agent Team mailbox projection from retaining every
    # delivered message forever. The persistent package patch makes this the
    # steady-state behavior after restart; this row also compacts the already
    # running process without waiting for that restart.
    - id: team-agentteam-mailbox-compaction
      name: './plugins/team-agentteam-mailbox-compaction.mjs'

    # Phase 4: the human operator's own channel. dsh-commands runs a handler
    # against the receiving agent without creating a model message, so these
    # controls are deterministic and cannot be forgotten or refused by a model.
    # SoL-Pi step-boundary compaction: DSH only compacts on window pressure,
    # evaluated at whatever step the runtime happens to check. This folds the
    # transcript at a COMPLETED PLAN STEP instead, and only when the span being
    # folded can pay for its own summarization call.
    - id: step-compaction
      name: './plugins/step-compaction-v4.mjs'
      config:
        # At or above this size the next idle boundary folds the context even with no finished phase.
        proactiveFoldTokens: 500000
        # Must match the model's real contextWindow in settings.yaml.
        windowTokens: 1048576
        # At this share an idle agent auto-folds even without a milestone tick.
        autoCompactRatio: 0.75
        # A ticked milestone folds only once the context has reached this size. A milestone closes a large phase;
        # folding a small, still-cached context costs more than it saves. The 0.75 cap above is unaffected.
        minMilestoneFoldTokens: 200000
        # The pre-step listener owns the fail-closed budget check. Keep this
        # enabled in the real profile; the tool layer's similarly named option
        # is not the listener configuration.
        enablePreStep: true
        # v13 D: calculate the economic decision at idle boundaries but do not
        # fold unless the mandatory milestone/pressure path says so.
        opportunisticCompaction: shadow
        sessionsRoot: 'D:\dsh-test\home\sessions'
        telemetryDir: 'D:\dsh-test\home\team-control-plane'
        controlDir: 'D:\dsh-test\home\team-control-plane'
        debtFile: 'D:\dsh-test\home\team-control-plane\v13-compaction-debt.json'
        # DeepSeek cache-write/cache-read price ratio used by the current
        # provider. Replace this when the provider's cache economics change.
        cacheWriteReadRatio: 50
        # The default route sends max output 128000; reserving less let 915k requests through to a provider 400.
        reservedOutputTokens: 128000
        safetyMarginTokens: 32768
        # Follow the active session's routed reasoning effort so the summary
        # call stays in the same upstream cache scope.
        compactionReasoningEffort: inherit

    # Safety net: a Team whose members all finished WITHOUT reporting goes silent, and to an
    # observer that only sees messages that looks exactly like work in flight. 30s of the
    # whole Team stopped (Lead included) -> one WAKING reminder to the Lead, once per episode.
    # A quiet inject would be useless: an idle Lead with an empty inbox never reads it.
    - id: team-idle-watch
      name: './plugins/team-idle-watch-v6.mjs'
      config:
        settleMs: 30000
        bootstrapScanMs: 30000
        # No lifetime/no-progress cap: each distinct stop episode gets one wake.

        controlDir: 'D:\dsh-test\home\team-control-plane'

        intervalMs: 600000

    # Provider auth/quota failures are terminal for the whole Team until tier 0
    # explicitly resumes it after fixing the provider. Transient 429/timeouts
    # stay with the adapter's existing retry policy.
    - id: team-runtime-guard
      name: './plugins/team-runtime-guard.mjs'
      config:
        controlDir: 'D:\dsh-test\home\team-control-plane'

    # DISABLED: this one wrote a CUSTOM event type ('team/usage') into the session journal
    # so a projection could read it, and the harness log reader refuses to interpret any
    # session containing an unknown event type — it bricked the history of every session it
    # ran in. Reading the journals (see team-usage.mjs / the /team usage command) is the
    # safe half of that idea and is kept; writing to the log is not.
    - id: team-usage-projection
      name: './plugins/team-usage-projection.mjs'
      disabled: true

    - id: team-operator
      name: './plugins/team-operator-v5.mjs'
      config:
        reportDir: 'D:\dsh-test\home\team-reports'
        spawnDescription: 'Created by the human operator'
