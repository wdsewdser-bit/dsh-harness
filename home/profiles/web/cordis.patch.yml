          # ── deterministic Chinese warmup -> PTC ────────────────────────────────────
          #
          # 头几次请求是合成的预热轮，讲的全是猫娘那套干活习惯：先看主人要啥、
          # 猜错了就改、一起读排队写、先做能跑的、看图先看整体、真跑过再说好，
          # 最后才是 PTC 的并发和工具面规矩。走完最后一轮才切 Code Mode，
          # 所以被推迟的主人那条真消息，看到的第一个就是 `run_code`。
          - id: catgirl-warmup-ptc-replay
            name: ./presets/minimal-zh-ptc-catgirl/zh-warmup-ptc-replay.mjs
            config:
              shellTools: [ bash, pwsh ]
              commonTools: [ str_replace_editor ]
              subagents: false
              replayFile: ./replay.json

          # ── 工具信息中文化（把模型看到的那一大坨英文换成中文）──────────────────────
          #
          # PTC 下工具不是原生 schema，而是 dsh-tools 渲染的 tools:sdk 段落：每个工具的
          # description 变成接口声明上面的注释行，外加三固定英文段（run_code 用法、程序内
          # 约定、PTC-only 规则）。本插件在 system-prompt/assemble 瀑布里把这三段和每个
          # 工具的说明换成中文（catgirl-tool-zh.json），只改模型可见文本，不动行为。
          # 固定段落按精确匹配替换，匹配不到就保持英文并只告警一次；漏翻的工具名也会汇总
          # 成一条 warning，方便补表。改 .mjs 要重启 dsh 进程，改 .json 重开新会话即可。
          - id: catgirl-tool-zh
            name: ./presets/minimal-zh-ptc-catgirl/catgirl-tool-zh.mjs
            config:
              tableFile: ./catgirl-tool-zh.json

          # ── 压缩后重新预热（长会话里最狠的那次漂移点）─────────────────────────────
          #
          # 一次 compaction 会把开头那 10 轮中文 few-shot 折进 <compacted-summary>，
          # 之后只剩一条短锚定，撑不住长思维链的示范。所以每个 compaction/end 之后的
          # 下一个 turn 开头，先跑 2 轮合成重热轮（llm/stream 直接回放
          # catgirl-reheat.json，不花 provider 请求），主人的真实输入按原顺序推迟到
          # 重热之后；子代理跳过，每会话最多 4 次。细节看 catgirl-reheat.mjs 顶部。
          - id: catgirl-reheat
            name: ./presets/minimal-zh-ptc-catgirl/catgirl-reheat.mjs
            config:
              reheatFile: ./catgirl-reheat.json
              replayFile: ./replay.json
              maxPerSession: 4
              subagents: false

          # ── 把人格钉在系统提示词后面（长会话里周期性重钉）──────────────────────────
          #
          # DeepSeek 的 systemPromptUpdate 是 "in-history"：切到 PTC 时那套英文系统
          # 提示词（含工具 SDK 声明）是一万多字符，中文人格只占开头一小截，模型容易
          # 跟着英文走。两层锚定，细节看 catgirl-persona-anchor.mjs 顶部：
          #   1) systemPrompt.context() 的早期中文锚定：进历史一次；compaction 把它
          #      替换掉之后，RuntimeContextProjection 会自动重投影一次。
          #   2) agent/pre-step 的「尾部重锚」：每轮第一步 + 每 everySteps 步，往本轮
          #      消息末尾追加一条短中文锚定，专门压住越堆越多、排在后面的英文工具结果。
          #      它是**持久 user 消息**（会进会话历史），所以 everySteps 别调太小；
          #      compaction 会把累积的那几条一起清掉。
          - id: catgirl-persona-anchor
            name: ./presets/minimal-zh-ptc-catgirl/catgirl-persona-anchor.mjs
            config:
              everySteps: 6
              anchorTurnStart: true
              # 上一步思考超过 300 字就插一条「纠正版」硬提醒（0 = 关）。
              maxReasoningChars: 200
              subagents: false
              replayFile: ./replay.json
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: cmd
        model: deepseek/deepseek-v4.1-flash
      - provider: deepseek-official
        model: deepseek-flash
      - provider: opencodego
        model: deepseek-v4.1-flash

# END alpha7-migrated-preset minimal-zh-ptc-catgirl

# hot-reload marker: 2026-09-27T20:56+08:00 (product-scoped compaction recovery)

# Module-level hot reload for our own Team plugins. dsh-base ships
# `root: []`, which only reloads patch files; listing the plugins directory
# makes a changed .mjs re-import without restarting the whole worker.
# v12 activation marker: 2026-09-24T14:59+08:00
- id: hmr
  config:
    # Resolve plugin paths from the profile directory. An absolute Windows
    # root has been misinterpreted by chokidar with the inherited user-home
    # cwd, which made HMR try to watch C:\Users\...\NTUSER.DAT and fail.
    # Keep this pinned to the active web profile; desktop has its own patch.
    base: 'file:///D:/dsh-test/home/profiles/web/'
    root:
      - 'plugins'
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: standard
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: web-search-deepseek
  name: "@deepseek-ai/dsh-web-search-deepseek"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    maxUses: 100

# Settings-editable override for the Reducer row inserted above. The settings
# editor writes a non-insert row by id; without this row it refuses because the
# inserted entry is treated as a read-only overlay.
- id: evidence-reducer
  config:
    enabled: true
    settingsFile: D:\dsh-test\home\evidence-reducer.json
    useSettingsFile: true
    archiveDir: D:\dsh-test\home\evidence-archive
    sessionsRoot: D:\dsh-test\home\sessions
    telemetryDir: D:\dsh-test\home\team-control-plane
    localProviders:
      - opencodego
    tools: []
    routeMode: session
    provider: ""
    model: ""
    reasoningEffort: ""
    remoteAllowed: false
    thresholdBytes: 32768
    maxReceiptTokens: 1200
    timeoutMs: 45000
    maxQuotes: 16
    maxInputBytes: 131072
    maxInputLines: 3000
    controlDir: D:\dsh-test\home\team-control-plane
    controlPlaneEnabled: true

# Verified v16 capability bridge. Collector scope remains unchanged.
- insert:
    - id: team-v16-capabilities-runtime
      name: ./plugins/team-v16-capabilities-runtime.mjs
      config:
        controlDir: D:/dsh-test/home/team-control-plane
