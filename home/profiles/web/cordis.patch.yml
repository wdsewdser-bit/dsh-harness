# Agent Team member cap. The shipped @deepseek-ai/dsh-experimental-agent-team-profile
# bundle inserts this row with maxMembers: 8, which is the number of teammate
# roster entries a single Team can hold (the Lead is a pseudo-row and is not
# counted). The local default is 30 so a large project can create new roles
# without reusing an unrelated member. There is no separate lifetime-create
# counter in the v2 policy layer.
#
# A patch replaces the targeted row's WHOLE `config` object rather than merging
# into it, so every shipped key is restated here even though only maxMembers
# differs. Dropping a key silently reverts it to the plugin default.
#
# Revert: delete this entry.
- id: agent-team
  name: '@deepseek-ai/dsh-experimental-agent-team'
  config:
    # The domain roster is immutable and still counts frozen members. Keep a
    # generous backstop; the policy layer enforces the effective 30 active slots.
    maxMembers: 500
    maxTasks: 256
    # Large projects can leave a lead inactive while its members report. The
    # 64-message core default made the wake itself hit TEAM_MAILBOX_FULL, so
    # keep enough headroom to resume and drain the target.
    maxPendingMessagesPerMember: 1024
    maxMessageBytes: 65536
    disposalTimeoutMs: 5000

