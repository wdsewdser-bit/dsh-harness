          长会话里被英文系统提示词和英文工具结果带跑。随后与官方 ptc 预设一致的工具面（run_code；shell 按平台自动选：Linux
          用持久 bash，Windows 用持久 pwsh），文本修改优先 str_replace_editor。 长会话抗稀释：每轮尾部重锚 +
          压缩后重热 + 把 31 个工具的英文说明换成中文。"
